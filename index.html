const STORAGE_KEY='looplocker_hk_v2_demo_2026';
let persistent={phase:1,bookings:[],listings:[],feedback:[]};
try{let saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');if(saved&&typeof saved==='object'){persistent={...persistent,...saved};if(![1,2].includes(persistent.phase))persistent.phase=1;for(let x of ['bookings','listings','feedback'])if(!Array.isArray(persistent[x]))persistent[x]=[];}}catch(e){}
const state={page:'explore',category:'All',query:'',selectedItem:null,bookingId:null,bookingStart:isoDays(1),bookingEnd:isoDays(3),modal:null,listImg:'',listFilename:'',issueId:null};
let toastTimer=null;
function isoDays(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cur(v){return 'HK$'+Number(v||0).toLocaleString('en-HK',{maximumFractionDigits:2})}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(persistent))}catch(err){}}
function allItems(){return [...persistent.listings,...seeded]}
function itemById(id){return allItems().find(v=>v.id===id)}
function phase(){return persistent.phase}
function days(start,end){let a=Date.parse(start+'T12:00:00'),b=Date.parse(end+'T12:00:00');return Math.round((b-a)/86400000)}
function art(item){return `<div class="art ${e(item.color||'')}">${SVG[item.type]||SVG.book}<span class="art-tag">${e(item.tag||'Student listing')}</span></div>`}
const infoIcon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 10v7M12 7h.01"/></svg>`;
const searchIcon=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>`;
function header(){const navs=[['explore','Discover'],['rentals','My rentals'],['list','List an item'],['how','How it works'],['testing','User testing']];return `<header class="topbar"><div class="wrapper topbar-inner"><a href="#" class="brand" data-action="nav" data-page="explore"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="9" width="16" height="12" rx="3"/><path d="M8 9V6a4 4 0 0 1 8 0v3M9 15h6M12 12v6"/></svg></span><span>LoopLocker HK<small>V2 INTERACTIVE DEMO</small></span></a><nav class="nav" aria-label="Main navigation">${navs.map(([key,label])=>`<button type="button" data-action="nav" data-page="${key}" class="${state.page===key?'active':''}">${label}</button>`).join('')}</nav><div class="top-controls"><span class="mini-badge">● CONCEPT</span><div class="phase-picker" role="group" aria-label="Choose prototype phase"><button type="button" data-action="phase" data-phase="1" aria-pressed="${phase()===1}" class="${phase()===1?'active p1':''}">Phase 1</button><button type="button" data-action="phase" data-phase="2" aria-pressed="${phase()===2}" class="${phase()===2?'active p2':''}">Phase 2</button></div></div></div></header>`}
function hero(){const p1=phase()===1;const flow=p1?['Find & book a student item','Agree on a campus meeting point','Meet the owner and collect','Return it at the agreed time']:['Find & book a student item','View the locker building and floor','Use demo QR / access code','Return to the assigned locker'];return `<section class="hero wrapper"><div class="hero-inner"><div class="eyebrow">University sharing · Two-stage prototype</div><h1>Borrow what you need.<br><em>Earn from what you own.</em></h1><p>Rent useful items from other students — with clear prices, refundable deposits and a safer, simpler handover journey.</p><div class="hero-actions"><button class="btn-white" data-action="nav" data-page="explore">Explore items →</button><button class="btn-outline" data-action="nav" data-page="how">Compare both phases</button></div></div><div class="hero-card"><div class="smalltop"><span>How ${p1?'Phase 1':'Phase 2'} works</span><span>${p1?'In-person pilot':'Smart locker model'}</span></div>${flow.map((x,i)=>`<div class="route-step"><span class="num">${i+1}</span><span>${x}</span></div>`).join('')}</div></section>`}
function phaseNote(){let p1=phase()===1;return `<div class="phase-note ${p1?'blue':'green'} wrapper">${infoIcon}<div><strong>${p1?'Phase 1 — In-person pilot':'Phase 2 — Smart locker expansion'}</strong> · ${p1?'Borrowers and lenders arrange a meeting at a proposed campus point; no lockers needed at this stage.':'The app shows a demo locker map, a simulated access code and return flow. No real hardware is connected.'} <strong>Both phases are concepts only</strong>; campus permission and real operations are not confirmed.</div></div>`}
function card(item){return `<article class="item-card">${art(item)}<div class="item-body"><div class="item-topline"><span>${e(item.category)}</span><span>● Available (demo)</span></div><h3>${e(item.name)}</h3><p>Student-owned · ${e(item.owner)}</p><div class="item-bottom"><div class="price"><strong>${cur(item.price)}</strong><small> / day</small></div><button class="btn-primary" data-action="open-item" data-id="${e(item.id)}">View & rent</button></div></div></article>`}
function discover(){let categories=['All','Study','Sports','Equipment','Electronics','Everyday'];return `<section class="content wrapper"><div class="section-head"><div><h2>Discover campus items</h2><p>Find a useful item without buying it. These listings are sample data for testing.</p></div><span class="status">Student-to-student rentals</span></div><div class="toolbar"><div class="search">${searchIcon}<input id="searchBox" aria-label="Search items" placeholder="Search calculators, rackets, textbooks..." value="${e(state.query)}"></div><div class="filters">${categories.map(x=>`<button data-action="category" data-category="${e(x)}" class="filter ${state.category===x?'active':''}">${e(x)}</button>`).join('')}</div></div><div class="section-head" style="margin-bottom:11px"><span class="card-count" id="resultsCount"></span><span class="site-note">Pilot focus: non-sensitive, easily shared student items</span></div><div id="cardGrid" class="cards"></div></section>`}
function renderGrid(){let root=document.getElementById('cardGrid');if(!root)return;let items=allItems().filter(x=>(state.category==='All'||x.category===state.category)&&`${x.name} ${x.category} ${x.condition}`.toLowerCase().includes(state.query.toLowerCase()));root.innerHTML=items.length?items.map(card).join(''):`<div class="empty"><h3>No matching items</h3><p>Try another category or search word.</p><button class="btn-secondary" data-action="reset-filter">Show all items</button></div>`;let count=document.getElementById('resultsCount');if(count)count.textContent=items.length+' items available (demo)';}
function rentals(){const bookings=[...persistent.bookings].reverse();return `<section class="content wrapper"><div class="section-head"><div><h2>My rentals</h2><p>View reservations, handover instructions, collection and return progress.</p></div><button class="btn-secondary" data-action="nav" data-page="explore">+ Book an item</button></div>${bookings.length?bookings.map(b=>`<div class="rental-card">${art(b.item)}<div><h3>${e(b.item.name)}</h3><p>${e(b.start)} to ${e(b.end)} · ${b.days} day${b.days>1?'s':''} · ${cur(b.item.price*b.days)} rental</p><div class="rental-tags"><span class="tag ${b.phase===1?'blue':''}">Phase ${b.phase} — ${b.phase===1?'In-person':'Smart locker'}</span><span class="tag ${b.status==='reserved'?'orange':''}">${e(statusText(b.status))}</span></div></div><button class="btn-secondary" data-action="booking" data-id="${e(b.id)}">View journey →</button></div>`).join(''):`<div class="panel" style="text-align:center;padding:49px"><div style="font-size:40px">📅</div><h3>No bookings yet</h3><p>Choose an item in Discover, then book it to test the complete borrower journey.</p><button class="btn-primary" data-action="nav" data-page="explore">Explore items</button></div>`}<h3 class="subheading">Items I listed</h3>${persistent.listings.length?persistent.listings.map(x=>`<div class="rental-card">${art(x)}<div><h3>${e(x.name)}</h3><p>${e(x.category)} · ${cur(x.price)}/day · ${e(x.condition)}</p><span class="tag">Available for demo bookings</span></div><button class="btn-secondary" data-action="open-item" data-id="${e(x.id)}">View listing</button></div>`).join(''):`<div class="panel"><p>No user-created listings yet. Test the lender journey by creating one.</p><button class="btn-primary" data-action="nav" data-page="list">List an item</button></div>`}</section>`}
function listing(){return `<section class="content wrapper"><div class="section-head"><div><h2>List an item</h2><p>Demo lender flow: add a photo, review suggested details, and publish a test listing.</p></div><span class="status">Lender journey</span></div><div class="two-col"><div class="panel"><div class="panel-head"><h3>Item information</h3><span class="mini-badge">OWNER CONFIRMATION</span></div><div class="field"><label for="itemPhoto">Item photo (optional)</label><input id="itemPhoto" type="file" accept="image/*"><span class="hint">The preview stays in your browser session; photos are not sent to a server.</span></div><div id="photoPreview" class="mini-info">Upload a photo to preview your item here.</div><div style="margin:13px 0"><button class="btn-secondary" data-action="suggest">✨ Suggest details (simulated AI)</button></div><form id="listingForm"><div class="field"><label for="itemName">Item name *</label><input id="itemName" required maxlength="65" placeholder="e.g., Scientific Calculator"></div><div class="field"><label for="itemCategory">Category *</label><select id="itemCategory" required><option>Study</option><option>Sports</option><option>Equipment</option><option>Electronics</option><option>Everyday</option></select></div><div class="field"><label for="itemDesc">Description and item condition *</label><textarea id="itemDesc" required maxlength="320" placeholder="Condition, features, and what is included"></textarea></div><div class="row-fields"><div class="field"><label for="priceInput">Rental price / day (HK$) *</label><input id="priceInput" type="number" min="1" max="1000" step="1" value="10" required></div><div class="field"><label for="depositInput">Refundable deposit (HK$) *</label><input id="depositInput" type="number" min="0" max="5000" step="1" value="50" required></div></div><div class="field"><label for="availabilityInput">Availability note</label><input id="availabilityInput" maxlength="90" placeholder="e.g., Weekdays after 2pm"></div><button type="submit" class="btn-primary" style="width:100%">Preview & publish demo listing</button></form></div><div><div class="panel" style="margin-bottom:17px"><h3>How the AI helper works</h3><p>This is a simulated feature, not a connected AI model. The demo can suggest a category and description using simple file-name keywords; you must review and edit before publishing.</p><div class="steps"><div class="step"><span class="stepnum">1</span><div><strong>Upload a photo</strong><small>Use any non-sensitive sample item.</small></div></div><div class="step"><span class="stepnum">2</span><div><strong>Review demo suggestions</strong><small>Suggestions may be incorrect. Edit all fields.</small></div></div><div class="step"><span class="stepnum">3</span><div><strong>Publish the listing</strong><small>Your demo item appears in Discover and My rentals.</small></div></div></div></div><div class="panel"><h3>Safety and earnings</h3><ul class="single-list"><li>Only suitable, clean, non-sensitive items are allowed in the proposed pilot.</li><li>Phones, tablets, storage devices, and devices containing personal data are excluded.</li><li>Owners receive 90% of the rental fee; LoopLocker keeps 10% commission.</li><li>Refundable deposits are not revenue.</li><li>Handover uses the selected phase; no real payment or identity verification occurs.</li></ul></div></div></div></section>`}
function how(){return `<section class="content wrapper"><div class="section-head"><div><h2>One app, two operating phases</h2><p>LoopLocker HK validates demand with a low-cost pilot before considering smart lockers.</p></div><span class="status">V2 design rationale</span></div><div class="two-col"><div class="panel"><span class="phase-label p1">Phase 1 · In-person handover</span><h3 style="margin-top:14px">Launch small. Learn quickly.</h3><p>Borrowers and lenders agree on a campus meeting place and time, subject to university permission. The app coordinates prices, bookings and return reminders.</p><div class="steps"><div class="step"><span class="stepnum">1</span><div><strong>Search and book</strong><small>See price, refundable deposit and date range.</small></div></div><div class="step"><span class="stepnum">2</span><div><strong>Arrange a meeting</strong><small>Choose a proposed point and time.</small></div></div><div class="step"><span class="stepnum">3</span><div><strong>Check condition together</strong><small>Photographs reduce disputes.</small></div></div><div class="step"><span class="stepnum">4</span><div><strong>Return on time</strong><small>Reminders and human-reviewed issues.</small></div></div></div><div class="box-actions"><button class="btn-primary" data-action="phase" data-phase="1">Try Phase 1</button></div></div><div class="panel"><span class="phase-label p2">Phase 2 · Smart lockers</span><h3 style="margin-top:14px">Expand after validation.</h3><p>When funding, demand and approvals allow, a limited number of smart lockers support QR-code pickup and return at assigned compartments.</p><div class="steps"><div class="step"><span class="stepnum">1</span><div><strong>Reserve a smart locker item</strong><small>A locker hub is assigned in the demo.</small></div></div><div class="step"><span class="stepnum">2</span><div><strong>Find the locker</strong><small>Building, floor, locker bank and map.</small></div></div><div class="step"><span class="stepnum">3</span><div><strong>Use access code</strong><small>Demo QR / one-time code; no live hardware.</small></div></div><div class="step"><span class="stepnum">4</span><div><strong>Return to assigned locker</strong><small>Record item condition and confirm return.</small></div></div></div><div class="box-actions"><button class="btn-primary" data-action="phase" data-phase="2">Try Phase 2</button></div></div></div><h3 class="subheading">What changed from the original prototype?</h3><div class="workflow"><div class="flow-card blue"><div class="flow-emoji">✨</div><div class="flow-title">Simpler listing</div><p>Simulated AI suggestions with owner confirmation.</p></div><div class="flow-card blue"><div class="flow-emoji">🗓️</div><div class="flow-title">Flexible pilot</div><p>Meeting points reduce up-front hardware cost in Phase 1.</p></div><div class="flow-card green"><div class="flow-emoji">📍</div><div class="flow-title">Clear locker location</div><p>Building, floor and exact locker identifier in Phase 2.</p></div><div class="flow-card green"><div class="flow-emoji">🔐</div><div class="flow-title">Return & trust</div><p>Reminders, condition records and privacy safeguards.</p></div></div><div class="mini-info" style="margin-top:20px">University approval, hardware procurement, payment operations, and automatic access control are outside this design-only demonstration.</div></section>`}
function testing(){return `<section class="content wrapper"><div class="section-head"><div><h2>User testing workspace</h2><p>Record task-based interviews with student borrowers and lenders — not a general survey.</p></div><span class="status">No real names or student IDs</span></div><div class="test-cards"><div class="test-card"><span class="phase-label p1">Borrower scenario</span><h4 style="margin-top:13px">Borrow a calculator for two days</h4><p>Search, inspect details, choose dates, review fees and deposit, book, and explain collection and return steps.</p><button class="btn-secondary" data-action="nav" data-page="explore">Start borrower task →</button></div><div class="test-card"><span class="phase-label p2">Lender scenario</span><h4 style="margin-top:13px">List a calculator for rent</h4><p>Upload a sample photo, review AI suggestions, set price and deposit, publish, then explain how the item reaches the renter.</p><button class="btn-secondary" data-action="nav" data-page="list">Start lender task →</button></div></div><div class="two-col" style="margin-top:20px"><div class="panel"><h3>Record one testing session</h3><p>Only enter actual interview observations. This tool stores responses locally on this device.</p><form id="feedbackForm"><div class="row-fields"><div class="field"><label for="testerCode">Anonymous tester code *</label><input id="testerCode" maxlength="15" required placeholder="e.g., P01"></div><div class="field"><label for="testerRole">Role *</label><select id="testerRole"><option value="Borrower">Borrower</option><option value="Lender">Lender</option></select></div></div><div class="row-fields"><div class="field"><label for="testerPhase">Tested phase</label><select id="testerPhase"><option value="Phase 1">Phase 1 · In-person</option><option value="Phase 2">Phase 2 · Smart locker</option></select></div><div class="field"><label for="testerTime">Task time (minutes)</label><input id="testerTime" type="number" min="0" max="90" step="0.5" placeholder="e.g., 5.5"></div></div><div class="field"><label for="testerOutcome">Task result *</label><select id="testerOutcome"><option>Completed without help</option><option>Completed with help</option><option>Not completed</option></select></div><div class="field"><label for="testerEase">Ease of use (1=very difficult, 5=very easy)</label><select id="testerEase"><option value="5">5 — Very easy</option><option value="4">4 — Easy</option><option value="3">3 — Neutral</option><option value="2">2 — Difficult</option><option value="1">1 — Very difficult</option></select></div><div class="field"><label for="testerIssues">Observed issue / participant feedback</label><textarea id="testerIssues" maxlength="700" placeholder="Record the participant's actual observation or feedback, not an invented quotation."></textarea></div><button class="btn-primary" type="submit">Save this observation</button></form></div><div class="panel"><h3>Recorded sessions</h3><div class="feedback-count" id="feedbackCount">${persistent.feedback.length}</div><div class="small-muted">Responses saved locally · 6 interviewees planned</div><div class="divider"></div><div id="feedbackBlock">${feedbackTable()}</div><div class="box-actions"><button class="btn-secondary" data-action="export-feedback" ${persistent.feedback.length?'':'disabled'}>Export CSV</button><button class="btn-danger" data-action="clear-feedback" ${persistent.feedback.length?'':'disabled'}>Clear observations</button></div><div class="warning" style="margin-top:15px">This app does not conduct the interviews for you. Include real dates, location and testing evidence in your assignment. Avoid collecting student identity details.</div></div></div></section>`}
function feedbackTable(){if(!persistent.feedback.length)return '<p class="small-muted">No interviews recorded yet. Run a scenario and enter the real observation here.</p>';return `<table class="feedback-table"><thead><tr><th>Code</th><th>Role</th><th>Phase</th><th>Outcome</th><th>Ease</th></tr></thead><tbody>${persistent.feedback.map(x=>`<tr><td>${e(x.code)}</td><td>${e(x.role)}</td><td>${e(x.phase)}</td><td>${e(x.outcome)}</td><td>${e(x.ease)}/5</td></tr>`).join('')}</tbody></table>`}
function statusText(v){return({reserved:'Reserved · pending collection',collected:'Collected · awaiting return',returned:'Returned · deposit review'})[v]||v}
function findBooking(id){return persistent.bookings.find(x=>x.id===id)}
function bookingPage(){const b=findBooking(state.bookingId);if(!b)return `<section class="content wrapper"><div class="panel">Booking not found. <button class="btn-secondary" data-action="nav" data-page="rentals">My rentals</button></div></section>`;const p2=b.phase===2,here=b.location;return `<section class="content wrapper"><div class="section-head"><div><h2>Booking ${e(b.id.slice(-6))}</h2><p>${e(b.item.name)} · ${e(b.start)} → ${e(b.end)} · ${b.days} day${b.days>1?'s':''}</p></div><span class="phase-label ${p2?'p2':'p1'}">Phase ${b.phase} · ${p2?'Smart locker':'In-person'}</span></div><div class="two-col"><div class="panel"><div class="panel-head"><h3>${p2?'Smart locker pickup':'Campus handover'}</h3><span class="tag ${b.status==='reserved'?'orange':''}">${e(statusText(b.status))}</span></div><div class="mini-info">${p2?'Illustrative locker location and simulated code. No actual locker access.':'Proposed meeting point for task-based testing only. University permission is not confirmed.'}</div><div class="divider"></div>${p2?`<div style="font-weight:850;font-size:19px;margin-bottom:7px">${e(here.name)}</div><div class="pillbar"><span>${e(here.building)}</span><span>${e(here.floor)}</span><span>Bank ${e(here.bank)}</span><span>Locker ${e(here.number)}</span></div><div class="demo-map" style="margin-top:14px"><div class="map-pin">📍 ${e(here.name)}</div><div class="map-route"></div><div class="map-start">Start / entrance</div><span class="map-disclaimer">Illustrative diagram · not an actual HKMU map</span></div><div class="subheading" style="font-size:15px;margin-top:17px">Access preview · QR-style mockup</div>${qrMock(b.code)}<p class="small-muted" style="text-align:center">Not scannable; use the demo code below.</p><div class="subheading" style="font-size:15px;margin-top:13px">One-time access code (simulation)</div><div class="big-code">${e(b.code)}</div><p class="small-muted" style="text-align:center">Preview code only — not connected to real hardware.</p><div class="steps"><div class="step"><span class="stepnum">1</span><div><strong>Go to the listed building and floor</strong><small>Confirm the locker bank and number.</small></div></div><div class="step"><span class="stepnum">2</span><div><strong>Enter the access code</strong><small>Access is simulated; live QR/lock control is not implemented.</small></div></div><div class="step"><span class="stepnum">3</span><div><strong>Collect and close the door</strong><small>Check the item condition before leaving.</small></div></div></div>`:`<h3>${e(here.name)}</h3><div class="pillbar"><span>${e(b.meetTime)}</span><span>Meeting point (proposed)</span></div><p>Please meet the owner at the selected campus meeting point. Check the item condition together and agree on the return arrangement.</p><div class="mini-info blue">Your booking is simulated. The app does not contact a real item owner or reserve a physical location.</div>`}<div class="divider"></div><div class="box-actions">${b.status==='reserved'?(p2?`<button class="btn-secondary" data-action="unlock" data-id="${e(b.id)}">${b.unlocked?'✓ Locker unlocked (simulated)':'🔓 Simulate locker unlock'}</button><button class="btn-primary" data-action="collect" data-id="${e(b.id)}" ${b.unlocked?'':'disabled'}>Mark item collected</button>`:`<button class="btn-primary" data-action="collect" data-id="${e(b.id)}">Mark item collected</button>`):b.status==='collected'?`<button class="btn-primary" data-action="return" data-id="${e(b.id)}">${p2?'Confirm return to locker':'Confirm in-person return'}</button>`:`<div class="mini-info">✓ Demo return completed. Deposit refund is subject to condition review; no real refund is processed.</div>`}<button class="btn-secondary" data-action="reminder">🔔 Preview return reminder</button><button class="btn-danger" data-action="open-issue" data-id="${e(b.id)}">Report an issue</button></div></div><div class="panel"><h3>Booking summary</h3><div style="display:flex;gap:14px;align-items:center">${art(b.item)}<div><b>${e(b.item.name)}</b><div class="small-muted">Owner: ${e(b.item.owner)}</div></div></div><div class="quote"><div class="quote-line"><span>Rental fee (${b.days} day${b.days>1?'s':''})</span><strong>${cur(b.days*b.item.price)}</strong></div><div class="quote-line"><span>Refundable deposit</span><strong>${cur(b.item.deposit)}</strong></div><div class="quote-line total"><span>Illustrative amount held</span><strong>${cur(b.days*b.item.price+b.item.deposit)}</strong></div></div><div class="mini-info">Commission: 10% of rental revenue is charged to the owner. The deposit is refundable and is not platform revenue. No actual payment occurs.</div><div class="divider"></div><h3>Return & trust</h3><div class="steps"><div class="step"><span class="stepnum">✓</span><div><strong>Rental dates recorded</strong><small>${e(b.start)} to ${e(b.end)}</small></div></div><div class="step"><span class="stepnum">✓</span><div><strong>Condition record recommended</strong><small>Photograph the item before collection and after return.</small></div></div><div class="step"><span class="stepnum">✓</span><div><strong>Late return policy</strong><small>Reminders support on-time return but cannot guarantee it. Disputes require human review.</small></div></div></div>${b.issue?`<div class="warning" style="margin-top:15px"><strong>Reported issue (demo):</strong> ${e(b.issue)}. Status: awaiting human review.</div>`:''}<div class="box-actions"><button class="btn-secondary" data-action="nav" data-page="rentals">← All rentals</button><button class="btn-secondary" data-action="phase" data-phase="${b.phase===1?2:1}">Try other phase</button></div></div></div></section>`}
function footer(){return `<footer class="wrapper footer"><span>LoopLocker HK · Interactive academic prototype · BUS 4028BEF</span><span>Concept only · No real payments, verified users, university approval or functioning smart lockers</span></footer>`}
function modal(){if(state.modal==='item')return itemModal();if(state.modal==='issue')return `<div class="modal-cover" role="presentation" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Report an issue"><div class="modal-head"><h2>Report an issue</h2><button class="modal-close" aria-label="Close" data-action="close-modal">×</button></div><p class="muted">The demo records a report locally. Real disputes would require human review, evidence and clear policies.</p><form id="issueForm"><div class="field"><label for="issueReason">Issue *</label><select id="issueReason"><option>Item damaged</option><option>Late return</option><option>Item missing</option><option>Other</option></select></div><div class="field"><label for="issueDetails">Brief description</label><textarea id="issueDetails" maxlength="260" placeholder="Do not enter personal information"></textarea></div><button type="submit" class="btn-primary">Save simulated report</button></form></div></div>`;return ''}
function itemModal(){const x=itemById(state.selectedItem);if(!x)return '';const d=Math.max(1,days(state.bookingStart,state.bookingEnd));const p2=phase()===2;return `<div class="modal-cover" role="presentation" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="Book ${e(x.name)}"><div class="modal-head"><div><div class="small-cap">Borrower booking demo</div><h2>${e(x.name)}</h2></div><button class="modal-close" aria-label="Close" data-action="close-modal">×</button></div><div class="detail-layout"><div>${art(x)}<h3 style="margin-bottom:5px">${cur(x.price)} <span class="small-muted">/ day</span></h3><p class="small-muted">${e(x.condition)}<br>Owner: ${e(x.owner)}</p><div class="mini-info">Clean, student-use items only. Device types holding personal information are excluded from the proposed initial pilot.</div></div><div><div class="row-fields"><div class="field"><label for="dateStart">Start date *</label><input id="dateStart" type="date" min="${isoDays(0)}" value="${e(state.bookingStart)}"></div><div class="field"><label for="dateEnd">End date *</label><input id="dateEnd" type="date" min="${isoDays(1)}" value="${e(state.bookingEnd)}"></div></div>${p2?`<div class="field"><label for="lockerHub">Demo locker location</label><select id="lockerHub"><option value="hubA">Demo Building A · 3/F · Bank B, Locker 12</option><option value="hubB">Demo Building B · 2/F · Bank A, Locker 07</option></select></div><div class="mini-info">Phase 2: simulated smart-locker pickup and return. Actual installation requires funding and approval.</div>`:`<div class="field"><label for="meetingPoint">Proposed meeting point</label><select id="meetingPoint"><option>Main entrance (illustrative)</option><option>Library foyer (illustrative)</option><option>Student common area (illustrative)</option></select></div><div class="field"><label for="meetTime">Suggested collection time</label><select id="meetTime"><option>10:00</option><option>12:00</option><option selected>14:00</option><option>16:00</option></select></div><div class="mini-info blue">Phase 1: in-person handover; the meeting must be agreed with the lender and permitted by the university.</div>`}<div id="quoteBox">${quoteMarkup(x,d)}</div><button class="btn-primary" id="confirmBooking" data-action="confirm-booking" style="width:100%">Confirm demo booking →</button><div class="caption">No actual funds collected. Deposit is not revenue; a 10% commission is deducted from the owner's rental earnings.</div></div></div></div></div>`}
function qrMock(code){
  // Visual prototype only: this is NOT a scannable QR or an access credential.
  const N=25;let seed=[...String(code)].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,2166136261);let boxes=[];
  function inFinder(x,y,ox,oy){return x>=ox&&x<ox+7&&y>=oy&&y<oy+7}
  function dot(x,y){let corners=[[0,0],[N-7,0],[0,N-7]];for(let [ox,oy] of corners){if(inFinder(x,y,ox,oy)){let dx=x-ox,dy=y-oy;return dx===0||dy===0||dx===6||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4)}}seed=(1664525*seed+1013904223)>>>0;return ((seed>>>27)&1)===1}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(dot(x,y))boxes.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
  return `<div class="qr-preview" aria-label="Decorative QR-style prototype, not scannable"><svg viewBox="0 0 25 25" shape-rendering="crispEdges" aria-hidden="true" fill="#143c31">${boxes.join('')}</svg></div>`
}
function quoteMarkup(item,d){return `<div class="quote"><div class="quote-line"><span>Rental fee · ${d} day${d>1?'s':''}</span><strong>${cur(d*item.price)}</strong></div><div class="quote-line"><span>Refundable deposit</span><strong>${cur(item.deposit)}</strong></div><div class="quote-line"><span>Booking fee charged to borrower</span><strong>HK$0</strong></div><div class="quote-line total"><span>Total displayed (demo)</span><strong>${cur(d*item.price+item.deposit)}</strong></div></div>`}
function rerender(){document.getElementById('app').innerHTML=header()+hero()+phaseNote()+(state.page==='explore'?discover():state.page==='rentals'?rentals():state.page==='list'?listing():state.page==='how'?how():state.page==='testing'?testing():state.page==='booking'?bookingPage():discover())+footer()+modal();renderGrid();}
function nav(p){state.page=p;state.modal=null;rerender();window.scrollTo({top:0,behavior:'smooth'})}
function flash(message){document.querySelector('.toast')?.remove();let div=document.createElement('div');div.className='toast';div.setAttribute('role','status');div.textContent=message;document.body.appendChild(div);if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(()=>div.remove(),3800)}
function nextId(){return 'LL'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*100).toString().padStart(2,'0')}
const lockers={hubA:{name:'Locker Hub A (demo)',building:'Demo Building A',floor:'3/F',bank:'B',number:'12'},hubB:{name:'Locker Hub B (demo)',building:'Demo Building B',floor:'2/F',bank:'A',number:'07'}};
function book(){const item=itemById(state.selectedItem),s=document.getElementById('dateStart')?.value,t=document.getElementById('dateEnd')?.value,n=days(s,t);if(!item||!s||!t||n<1||n>60||s<isoDays(0)){flash('Please choose a valid rental period between 1 and 60 days.');return}let l=phase()===2?lockers[document.getElementById('lockerHub')?.value||'hubA']:{name:document.getElementById('meetingPoint')?.value||'Main entrance',building:'Campus meeting point',floor:'',bank:'',number:''};let b={id:nextId(),item:{...item},start:s,end:t,days:n,phase:phase(),meetTime:document.getElementById('meetTime')?.value||'14:00',location:l,status:'reserved',unlocked:false,code:String(Math.floor(100000+Math.random()*900000)),created:new Date().toISOString()};persistent.bookings.push(b);save();state.selectedItem=null;state.modal=null;state.bookingId=b.id;state.page='booking';rerender();window.scrollTo({top:0,behavior:'smooth'});flash('Demo booking created. No payment or actual reservation was made.')}
function suggest(){let file=state.listFilename.toLowerCase(), name=document.getElementById('itemName'),category=document.getElementById('itemCategory'),desc=document.getElementById('itemDesc');if(!file){flash('Upload a sample photo first to try the simulated AI suggestion.');return}let guess=file.includes('racket')||file.includes('badminton')?['Badminton Racket','Sports','Good condition, ready for campus sports practice.']:file.includes('tripod')?['Camera Tripod','Equipment','Adjustable tripod in good condition.']:file.includes('book')?['Textbook','Study','Textbook in good condition with clean pages.']:file.includes('umbrella')?['Compact Umbrella','Everyday','Compact umbrella, lightly used and fully working.']:file.includes('charger')||file.includes('cable')?['USB-C Charging Adapter','Electronics','Working charging adapter with cable; contains no personal data.']:['Scientific Calculator','Study','Scientific calculator in good condition, fully working.'];name.value=guess[0];category.value=guess[1];desc.value=guess[2];flash('Suggested demo details added. Please review and edit before publishing.')}
function listSubmit(){const name=document.getElementById('itemName'),category=document.getElementById('itemCategory'),description=document.getElementById('itemDesc');let price=Number(document.getElementById('priceInput').value),deposit=Number(document.getElementById('depositInput').value);if(!name.value.trim()||!description.value.trim()||price<=0||!Number.isFinite(price)||deposit<0||!Number.isFinite(deposit)){flash('Please complete the item, price and deposit fields.');return}let map={Study:'calculator',Sports:'racket',Equipment:'tripod',Electronics:'cable',Everyday:'umbrella'};let x={id:nextId(),name:name.value.trim(),category:category.value,condition:description.value.trim(),price,deposit,owner:'You (demo lender)',type:map[category.value]||'book',tag:'New demo listing',color:'blue'};persistent.listings.unshift(x);save();state.listImg='';state.listFilename='';nav('explore');flash('Your demo listing is now visible in Discover!')}
function feedbackSubmit(){let code=document.getElementById('testerCode').value.trim(),role=document.getElementById('testerRole').value,tested=document.getElementById('testerPhase').value,outcome=document.getElementById('testerOutcome').value,ease=Number(document.getElementById('testerEase').value),time=document.getElementById('testerTime').value,issues=document.getElementById('testerIssues').value.trim();if(!code){flash('Please enter an anonymous code (for example P01).');return}persistent.feedback.push({code,role,phase:tested,outcome,ease,time,issues,date:new Date().toLocaleDateString('en-CA')});save();rerender();flash('Real observation saved locally on this device.')}
function csvExport(){if(!persistent.feedback.length)return;let columns=['code','role','phase','outcome','ease','time','issues','date'];let rows=[columns,...persistent.feedback.map(x=>columns.map(k=>String(x[k]??'')))].map(r=>r.map(s=>'"'+s.replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\uFEFF'+rows],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LoopLocker_HK_real_interview_observations.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function onClick(event){let el=event.target.closest('[data-action]');if(!el)return;let action=el.dataset.action,id=el.dataset.id;event.preventDefault();if(action==='nav'){nav(el.dataset.page);return}if(action==='phase'){persistent.phase=Number(el.dataset.phase)===2?2:1;save();state.modal=null;nav('explore');flash('Switched to Phase '+phase()+'. Existing demo bookings keep their original phase.');return}if(action==='category'){state.category=el.dataset.category;rerender();return}if(action==='reset-filter'){state.category='All';state.query='';rerender();return}if(action==='open-item'){state.selectedItem=id;state.bookingStart=isoDays(1);state.bookingEnd=isoDays(3);state.modal='item';rerender();return}if(action==='close-modal'){state.modal=null;rerender();return}if(action==='close-backdrop'){if(event.target===el){state.modal=null;rerender()}return}if(action==='confirm-booking'){book();return}if(action==='booking'){state.bookingId=id;nav('booking');return}if(action==='suggest'){suggest();return}if(action==='unlock'){let b=findBooking(id);if(b&&b.phase===2){b.unlocked=true;save();rerender();flash('Locker unlocked — simulation only.')}return}if(action==='collect'){let b=findBooking(id);if(b&&b.status==='reserved'&&(b.phase===1||b.unlocked)){b.status='collected';save();rerender();flash('Collection recorded in the demo.')}return}if(action==='return'){let b=findBooking(id);if(b&&b.status==='collected'){b.status='returned';save();rerender();flash('Return recorded. Deposit remains subject to simulated review.')}return}if(action==='reminder'){flash('🔔 Reminder preview: Return your rented item by the agreed deadline.');return}if(action==='open-issue'){state.issueId=id;state.modal='issue';rerender();return}if(action==='export-feedback'){csvExport();return}if(action==='clear-feedback'){if(confirm('Clear all locally recorded interview observations? This cannot be undone.')){persistent.feedback=[];save();rerender()}return}}
function onSubmit(ev){if(ev.target.id==='listingForm'){ev.preventDefault();listSubmit()}else if(ev.target.id==='feedbackForm'){ev.preventDefault();feedbackSubmit()}else if(ev.target.id==='issueForm'){ev.preventDefault();let b=findBooking(state.issueId);if(b){let reason=document.getElementById('issueReason').value,extra=document.getElementById('issueDetails').value.trim();b.issue=reason+(extra?' — '+extra:'');save()}state.issueId=null;state.modal=null;rerender();flash('Issue saved for simulated human review.')}}
function onChange(ev){let t=ev.target;if(t.id==='dateStart'||t.id==='dateEnd'){state.bookingStart=document.getElementById('dateStart').value;state.bookingEnd=document.getElementById('dateEnd').value;let n=days(state.bookingStart,state.bookingEnd),box=document.getElementById('quoteBox');if(box&&itemById(state.selectedItem))box.innerHTML=n>=1&&n<=60?quoteMarkup(itemById(state.selectedItem),n):'<div class="warning" style="margin-top:12px">End date must be after the start date (up to 60 days).</div>';}else if(t.id==='itemPhoto'){const f=t.files?.[0];state.listFilename=f?.name||'';const preview=document.getElementById('photoPreview');if(!f){state.listImg='';preview.textContent='Upload a photo to preview it here.';return}if(!f.type.startsWith('image/')){flash('Please choose an image.');return}const r=new FileReader();r.onload=()=>{state.listImg=String(r.result);preview.innerHTML=`<img alt="Your uploaded item preview" style="max-height:170px;max-width:100%;display:block;margin:auto;border-radius:9px" src="${state.listImg}">`};r.readAsDataURL(f)}}
function onInput(ev){if(ev.target.id==='searchBox'){state.query=ev.target.value;renderGrid()}}
document.addEventListener('click',onClick);document.addEventListener('submit',onSubmit);document.addEventListener('change',onChange);document.addEventListener('input',onInput);document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.modal){state.modal=null;rerender()}});rerender();
})();
</script>
</body>
